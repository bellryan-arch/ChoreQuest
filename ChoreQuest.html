    <div class="modal-body">
      <p style="color:var(--clr-text2);font-size:14px;margin-bottom:16px">Your parent password is still the default <strong>1234</strong>. Set a new one now to keep the kids out of Parent Mode!</p>
      <div class="form-group"><label>New Password</label>
        <input type="password" class="modal-input" id="new-pwd" placeholder="Enter new password" autofocus>
      </div>
      <div class="form-group"><label>Confirm Password</label>
        <input type="password" class="modal-input" id="confirm-pwd" placeholder="Confirm password">
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="dismissSetPassword()">Skip for now</button>
        <button class="btn-primary" onclick="saveNewPassword()">Set Password</button>
      </div>
    </div>`;
    setTimeout(() => { const i = document.getElementById('new-pwd'); if(i) i.focus(); }, 60);

  } else if (type === 'parent-login') {
    content.innerHTML = `
    <div class="modal-header"><h3>🔐 Parent Mode</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Password</label>
        <input type="password" class="modal-input" id="parent-pwd" placeholder="Enter password" autofocus>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="submitParentLogin()">Enter</button>
      </div>
    </div>`;
    setTimeout(() => {
      const inp = document.getElementById('parent-pwd');
      if (inp) { inp.focus(); inp.onkeydown = e => { if (e.key === 'Enter') submitParentLogin(); }; }
    }, 60);

  } else if (type === 'chore') {
    const ch     = payload || {};
    const isEdit = !!ch.id;
    content.innerHTML = `
    <div class="modal-header"><h3>${isEdit ? '✏️ Edit Quest' : '➕ New Quest'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Name *</label><input class="modal-input" id="m-name" value="${ch.name||''}" placeholder="e.g. Make Bed"></div>
      <div class="form-group"><label>Description</label><input class="modal-input" id="m-desc" value="${ch.description||''}" placeholder="Details…"></div>
      <div class="form-row">
        <div class="form-group"><label>Category</label>
          <select class="modal-input" id="m-cat">
            ${Object.entries(CATEGORY_INFO).map(([k,v]) => '<option value="' + k + '" ' + (ch.category===k?'selected':'') + '>' + v.icon + ' ' + v.label + '</option>').join('')}
          </select>
        </div>
        <div class="form-group"><label>Difficulty</label>
          <select class="modal-input" id="m-diff">
            <option value="easy" ${ch.difficulty==='easy'?'selected':''}>Easy</option>
            <option value="medium" ${ch.difficulty==='medium'||!ch.difficulty?'selected':''}>Medium</option>
            <option value="hard" ${ch.difficulty==='hard'?'selected':''}>Hard</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Points ⚡</label><input class="modal-input" type="number" id="m-pts" value="${ch.points||10}" min="1" max="200"></div>
        <div class="form-group"><label>Est. Time (min)</label><input class="modal-input" type="number" id="m-time" value="${ch.estimatedTime||10}" min="1" max="120"></div>
      </div>
      <div class="form-group"><label>Recurrence</label>
        <select class="modal-input" id="m-rec">
          <option value="daily" ${ch.recurrence==='daily'||!ch.recurrence?'selected':''}>Daily</option>
          <option value="weekly" ${ch.recurrence==='weekly'?'selected':''}>Weekly</option>
          <option value="monthly" ${ch.recurrence==='monthly'?'selected':''}>Monthly</option>
        </select>
      </div>
      <div class="form-group"><label>Quest Type</label>
        <div style="display:flex;gap:10px;margin-bottom:8px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px">
            <input type="radio" name="quest-type" id="qt-assigned" value="assigned"
                   ${!ch.upForGrabs?'checked':''} onchange="toggleGrabMode(false)">
            Assigned to specific kids
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;font-size:14px">
            <input type="radio" name="quest-type" id="qt-grab" value="grab"
                   ${ch.upForGrabs?'checked':''} onchange="toggleGrabMode(true)">
            ⚡ Up for Grabs
          </label>
        </div>
      </div>
      <div id="assign-section" ${ch.upForGrabs?'style="display:none"':''}>
      <div class="form-group"><label>Assign To</label>
        <div class="assign-children">
          ${state.children.map(c => `
          <label class="assign-child-label${(!ch.upForGrabs && (!ch.assignedTo || ch.assignedTo.includes(c.id))) ? ' is-checked' : ''}">
            <input type="checkbox" value="${c.id}" ${(!ch.upForGrabs && (!ch.assignedTo || ch.assignedTo.includes(c.id))) ? 'checked' : ''}
                   onchange="this.parentElement.classList.toggle('is-checked', this.checked)">
            ${c.avatar} ${c.name}
          </label>`).join('')}
        </div>
      </div>
      </div>
      <div id="grab-info" ${!ch.upForGrabs?'style="display:none"':''}>
        <div style="background:var(--clr-gold)22;border:1.5px solid var(--clr-gold);border-radius:10px;padding:10px;font-size:13px;color:#7A5C00;font-weight:700">
          ⚡ Any child can claim this quest — first tap wins the points!
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveChore('${ch.id||''}')">${isEdit ? 'Save' : 'Add Quest'}</button>
      </div>
    </div>`;

  } else if (type === 'reward') {
    const r     = payload || {};
    const isEdit = !!r.id;
    const icons  = ['🎁','📱','🎬','🍦','🌙','🏕️','💵','🌳','🍕','🎮','🎡','⚽','🎨','🎤','🍕','🛒'];
    content.innerHTML = `
    <div class="modal-header"><h3>${isEdit ? '✏️ Edit Reward' : '➕ New Reward'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Name *</label><input class="modal-input" id="r-name" value="${r.name||''}" placeholder="e.g. Movie Night"></div>
      <div class="form-group"><label>Description</label><input class="modal-input" id="r-desc" value="${r.description||''}" placeholder="Details…"></div>
      <div class="form-row">
        <div class="form-group"><label>Points ⚡</label><input class="modal-input" type="number" id="r-cost" value="${r.pointCost||50}" min="1"></div>
        <div class="form-group"><label>Icon</label>
          <select class="modal-input" id="r-icon">
            ${icons.map(ic => '<option value="' + ic + '" ' + (r.icon===ic?'selected':'') + '>' + ic + '</option>').join('')}
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="saveReward('${r.id||''}')">${isEdit ? 'Save' : 'Add Reward'}</button>
      </div>
    </div>`;

  } else if (type === 'avatar-picker') {
    const childId = payload;
    content.innerHTML = `
    <div class="modal-header"><h3>Choose Avatar</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="avatar-grid">
        ${CHILD_AVATARS.map(av => '<div class="avatar-option" onclick="selectAvatar(\'' + childId + '\',\'' + av + '\')">' + av + '</div>').join('')}
      </div>
    </div>`;
  }
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
  document.getElementById('modal-content').innerHTML = '';
}

function dismissSetPassword() {
  state.settings.hasSetPassword = true;  // Don't show again
  saveState();
  closeModal();
}

async function saveNewPassword() {
  const p1 = (document.getElementById('new-pwd')?.value || '').trim();
  const p2 = (document.getElementById('confirm-pwd')?.value || '').trim();
  if (!p1) { showToast('Enter a password', 'error'); return; }
  if (p1 !== p2) { showToast('Passwords do not match', 'error'); return; }
  state.settings.passwordRecord = await makePasswordRecord(p1);
  delete state.settings.parentPassword;  // remove any lingering plain text
  state.settings.hasSetPassword = true;
  saveState();
  closeModal();
  showToast('✅ Password set!', 'success');
}

async function submitParentLogin() {
  const inp = document.getElementById('parent-pwd');
  if (!inp) return;
  const ok = await verifyPassword(inp.value, state.settings.passwordRecord);
  if (ok) {
    isParentMode = true;
    closeModal();
    navigate('parent');
    showToast('Welcome, Parent! 👋', 'success');
  } else {
    showToast('Incorrect password', 'error');
    inp.value = '';
    inp.focus();
  }
}

function toggleGrabMode(isGrab) {
  const assignSection = document.getElementById('assign-section');
  const grabInfo = document.getElementById('grab-info');
  if (assignSection) assignSection.style.display = isGrab ? 'none' : '';
  if (grabInfo) grabInfo.style.display = isGrab ? '' : 'none';
}

function saveChore(choreId) {
  const name = (document.getElementById('m-name').value || '').trim();
  if (!name) { showToast('Please enter a quest name', 'error'); return; }
  const assigned = Array.from(document.querySelectorAll('.assign-children input:checked')).map(el => el.value);
  const isGrabCheck = document.getElementById('qt-grab')?.checked || false;
  if (!isGrabCheck && !assigned.length) { showToast('Assign to at least one adventurer', 'error'); return; }

  const isGrab = document.getElementById('qt-grab')?.checked || false;
  const data = {
    name,
    description:   document.getElementById('m-desc').value,
    category:      document.getElementById('m-cat').value,
    difficulty:    document.getElementById('m-diff').value,
    points:        parseInt(document.getElementById('m-pts').value) || 10,
    estimatedTime: parseInt(document.getElementById('m-time').value) || 10,
    recurrence:    document.getElementById('m-rec').value,
    assignedTo:    isGrab ? [] : assigned,
    upForGrabs:    isGrab,
    dueDate:       ''
  };

  if (choreId) {
    const ch = getChoreById(choreId);
    if (ch) Object.assign(ch, data);
  } else {
    state.chores.push({ id: uid(), ...data });
  }
  saveState();
  closeModal();
  showToast(choreId ? 'Quest updated!' : 'Quest added!', 'success');
  if (currentPage === 'quests') renderChoreList();
  if (currentPage === 'parent') showParentSection('quests');
}

function saveReward(rewardId) {
  const name = (document.getElementById('r-name').value || '').trim();
  if (!name) { showToast('Please enter a reward name', 'error'); return; }
  const data = {
    name,
    description: document.getElementById('r-desc').value,
    pointCost:   parseInt(document.getElementById('r-cost').value) || 50,
    icon:        document.getElementById('r-icon').value
  };
  if (rewardId) {
    const r = getRewardById(rewardId);
    if (r) Object.assign(r, data);
  } else {
    state.rewards.push({ id: uid(), ...data });
  }
  saveState();
  closeModal();
  showToast(rewardId ? 'Reward updated!' : 'Reward added!', 'success');
  if (currentPage === 'rewards') renderRewardsContent(rewardsChildId);
  if (currentPage === 'parent') showParentSection('quests');
}

function openChoreModal(choreId) {
  showModal('chore', choreId ? getChoreById(choreId) : null);
}

function openRewardModal(rewardId) {
  showModal('reward', rewardId ? getRewardById(rewardId) : null);
}

function selectAvatar(childId, avatar) {
  const c = getChildById(childId);
  if (c) { c.avatar = avatar; saveState(); closeModal(); showParentSection('children'); showToast('Avatar updated!', 'success'); }
}

// ============================================================
// EXPORT / IMPORT
// ============================================================

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: 'chorequest-' + getTodayStr() + '.json' });
  a.click();
  URL.revokeObjectURL(url);
  showToast('Data exported!', 'success');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('Replace all data with imported file?')) return;
      state = data;
      saveState();
      showToast('Data imported!', 'success');
      navigate('dashboard');
    } catch (err) {
      showToast('Invalid JSON file', 'error');
    }
  };
  reader.readAsText(file);
}

function resetAllData() {
  if (!confirm('RESET ALL DATA? This cannot be undone!')) return;
  if (!confirm('Absolutely sure? All progress will be permanently lost!')) return;
  state = getDefaultState();
  saveState();
  navigate('dashboard');
  showToast('All data reset', 'info');
}

// ============================================================
// CONFETTI
// ============================================================

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx    = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';

  const COLORS = ['#6C63FF','#FF6B6B','#4ECDC4','#FFD93D','#FF8B94','#51CF66'];
  const particles = Array.from({ length: 120 }, () => ({
    x:  Math.random() * canvas.width,
    y:  -10,
    w:  Math.random() * 12 + 5,
    h:  Math.random() * 7 + 3,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    vy: Math.random() * 3.5 + 2,
    vx: (Math.random() - 0.5) * 2.5,
    rot: Math.random() * 360,
    rotSpd: (Math.random() - 0.5) * 6,
    op:  1
  }));

  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y   += p.vy;
      p.x   += p.vx;
      p.rot += p.rotSpd;
      if (frame > 70) p.op = Math.max(0, p.op - 0.013);
      ctx.save();
      ctx.globalAlpha = p.op;
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < 160) requestAnimationFrame(draw);
    else { canvas.style.display = 'none'; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  draw();
}

// ============================================================
// TOAST
// ============================================================

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  container.appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => { el.classList.add('toast-show'); }); });
  setTimeout(() => {
    el.classList.remove('toast-show');
    setTimeout(() => el.remove(), 320);
  }, 3000);
}

// ============================================================
// SOUND
// ============================================================

let audioCtx = null;

function playSound(type) {
  if (!state.settings.soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'complete') {
      osc.frequency.setValueAtTime(523, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.12);
      osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.24);
    }
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
  } catch (e) {}
}

// ============================================================
// THEME
// ============================================================

function toggleTheme() {
  state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
  applyTheme();
  saveState();
}

function applyTheme() {
  document.body.dataset.theme = state.settings.theme;
  const btn = document.getElementById('btn-theme-toggle');
  if (btn) btn.textContent = state.settings.theme === 'dark' ? '☀️' : '🌙';
  // Apply custom colours
  const root = document.documentElement;
  const p = state.settings.primaryColor || '#6C63FF';
  const a = state.settings.accentColor  || '#FF6B6B';
  root.style.setProperty('--clr-primary', p);
  root.style.setProperty('--clr-secondary', a);
  // Derive a lighter primary
  root.style.setProperty('--clr-primary-light', p + 'CC');
}

// ============================================================
// PWA
// ============================================================

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt = e; });
function triggerInstall() {
  if (deferredInstallPrompt) { deferredInstallPrompt.prompt(); deferredInstallPrompt.userChoice.then(() => { deferredInstallPrompt = null; }); }
}

// ============================================================
// EVENT SETUP
// ============================================================

function setupEvents() {
  // Bottom nav
  document.querySelectorAll('.nav-btn').forEach(btn =>
    btn.addEventListener('click', () => navigate(btn.dataset.page))
  );

  // Header buttons
  document.getElementById('btn-theme-toggle').addEventListener('click', toggleTheme);
  document.getElementById('btn-parent-mode').addEventListener('click', () => {
    if (isParentMode) { isParentMode = false; navigate('dashboard'); showToast('Exited parent mode', 'info'); }
    else openParentMode();
  });

  // Back buttons
  document.getElementById('btn-back-child').addEventListener('click', () => navigate('dashboard'));
  document.getElementById('btn-back-parent').addEventListener('click', () => { isParentMode = false; navigate('dashboard'); });

  // Quest filters
  document.getElementById('filter-child').addEventListener('change', e => { choreFilters.child = e.target.value; renderChoreList(); });
  document.getElementById('filter-category').addEventListener('change', e => { choreFilters.category = e.target.value; renderChoreList(); });
  document.getElementById('chore-search').addEventListener('input', e => { choreFilters.search = e.target.value; renderChoreList(); });

  // Add chore / reward buttons (require parent mode)
  document.getElementById('btn-add-chore').addEventListener('click', () => {
    if (!isParentMode) { showToast('Parent mode required', 'info'); openParentMode(); return; }
    openChoreModal();
  });
  document.getElementById('btn-add-reward').addEventListener('click', () => {
    if (!isParentMode) { showToast('Parent mode required', 'info'); openParentMode(); return; }
    openRewardModal();
  });

  // Calendar nav
  document.getElementById('cal-prev').addEventListener('click', () => { calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); });
  document.getElementById('cal-next').addEventListener('click', () => { calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); });

  // Report tabs
  document.querySelectorAll('.tab-btn').forEach(btn =>
    btn.addEventListener('click', () => { renderReportTab(btn.dataset.tab); document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn)); })
  );

  // Modal overlay dismiss
  document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  // Escape key
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}

// ============================================================
// INIT
// ============================================================

async function init() {
  loadState();
  applyTheme();
  setupEvents();

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  }

  // Migrate any legacy plain-text password to hashed form
  await migratePassword();

  navigate('dashboard');

  // First-launch: prompt to set password if still default
  if (!state.settings.hasSetPassword && !state.settings.passwordRecord) {
    setTimeout(() => showModal('set-password'), 800);
  }

  // Delayed notification nudge
  if (state.settings.notificationsEnabled) {
    setTimeout(() => {
      state.children.forEach(child => {
        const daily     = getDailyChoresForChild(child.id);
        const todayDone = daily.filter(ch => isChoreCompletedToday(ch.id, child.id)).length;
        const remaining = daily.length - todayDone;
        if (remaining > 0 && remaining < daily.length) {
          showToast(child.avatar + ' ' + child.name + ': ' + remaining + ' quest' + (remaining > 1 ? 's' : '') + ' left today!', 'info');
        }
      });
    }, 3000);
  }
}

document.addEventListener('DOMContentLoaded', init);
