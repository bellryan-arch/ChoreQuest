<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chore Quest">
<meta name="theme-color" content="#6C63FF">
<title>Chore Quest ⚔️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');
/* ============================================================
   CSS VARIABLES & THEME
   ============================================================ */

:root {
  --clr-primary: #6C63FF;
  --clr-primary-light: #8B85FF;
  --clr-secondary: #FF6B6B;
  --clr-gold: #FFD93D;
  --clr-teal: #4ECDC4;
  --clr-green: #51CF66;

  --clr-bg: #F0F2FF;
  --clr-surface: #FFFFFF;
  --clr-surface2: #F8F9FF;
  --clr-border: #E5E7EB;
  --clr-text: #1A1B2E;
  --clr-text2: #6B7280;
  --clr-text3: #9CA3AF;

  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 24px;
  --shadow: 0 4px 20px rgba(108,99,255,0.10);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 32px rgba(108,99,255,0.18);

  --header-h: 60px;
  --nav-h: 70px;
  --font-display: 'Fredoka One', 'Comic Sans MS', 'Chalkboard SE', cursive;
  --font-body: 'Nunito', 'Segoe UI', Arial, sans-serif;
}

[data-theme="dark"] {
  --clr-bg: #0F0F1A;
  --clr-surface: #1A1B2E;
  --clr-surface2: #252640;
  --clr-border: #2E3058;
  --clr-text: #F0F2FF;
  --clr-text2: #9CA3AF;
  --clr-text3: #6B7280;
  --shadow: 0 4px 20px rgba(0,0,0,0.35);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.30);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.50);
}

/* ============================================================
   RESET & BASE
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  height: 100%;
}

body {
  font-family: var(--font-body);
  background: var(--clr-bg);
  color: var(--clr-text);
  min-height: 100%;
  min-height: 100dvh;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
  /* prevent pull-to-refresh interfering with the app */
  overscroll-behavior-y: none;
  -webkit-overflow-scrolling: touch;
}

h1,h2,h3 { font-family: var(--font-display); }

button {
  cursor: pointer;
  border: none;
  font-family: var(--font-body);
  /* Remove blue flash on tap (Android/iOS) */
  -webkit-tap-highlight-color: transparent;
  /* Prevent text selection on double-tap */
  -webkit-user-select: none;
  user-select: none;
  /* Minimum touch target */
  min-height: 44px;
  touch-action: manipulation;
}

input, select, textarea {
  font-family: var(--font-body);
  /* Minimum 16px prevents iOS auto-zoom on focus */
  font-size: 16px;
  background: var(--clr-surface2);
  color: var(--clr-text);
  border: 1.5px solid var(--clr-border);
  border-radius: var(--radius-sm);
  -webkit-appearance: none;
  appearance: none;
}

input::placeholder { color: var(--clr-text3); }

/* ============================================================
   LAYOUT
   ============================================================ */

.app-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--clr-surface);
  border-bottom: 1.5px solid var(--clr-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.app-logo { font-size: 24px; }

.app-title {
  font-size: 22px;
  color: var(--clr-primary);
  letter-spacing: -0.3px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.app-main {
  padding-top: var(--header-h);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px);
  min-height: 100dvh;
}

.page {
  display: none;
  padding: 16px;
  animation: pageFade 0.2s ease;
}

.page.active { display: block; }

@keyframes pageFade {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  /* Grow with iOS home indicator safe area */
  padding-bottom: env(safe-area-inset-bottom, 0px);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  background: var(--clr-surface);
  border-top: 1.5px solid var(--clr-border);
  display: flex;
  align-items: flex-start;
  z-index: 100;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  color: var(--clr-text3);
  font-size: 11px;
  font-weight: 600;
  padding: 8px 0;
  transition: all 0.18s;
  border-radius: 0;
}

.nav-btn.active {
  color: var(--clr-primary);
}

.nav-btn.active .nav-icon { transform: scale(1.15); }

.nav-icon { font-size: 22px; line-height: 1; transition: transform 0.18s; }
.nav-label { font-size: 10px; font-weight: 700; }

/* ============================================================
   BUTTONS
   ============================================================ */

.btn-primary {
  background: var(--clr-primary);
  color: #fff;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 14px;
  transition: all 0.18s;
  box-shadow: 0 3px 12px rgba(108,99,255,0.30);
}

.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(108,99,255,0.40); }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  background: var(--clr-surface2);
  color: var(--clr-text);
  border: 1.5px solid var(--clr-border);
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 14px;
  transition: all 0.18s;
}

.btn-secondary:hover { border-color: var(--clr-primary); color: var(--clr-primary); }

.btn-danger {
  background: #FF4757;
  color: #fff;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 14px;
}

.btn-success {
  background: var(--clr-green);
  color: #fff;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 13px;
}

.btn-danger-sm {
  background: #FF475722;
  color: #FF4757;
  border: 1.5px solid #FF475744;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
}

.btn-icon {
  background: var(--clr-surface2);
  border: 1.5px solid var(--clr-border);
  border-radius: 10px;
  width: 38px;
  height: 38px;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s;
}

.btn-icon:hover { border-color: var(--clr-primary); transform: scale(1.05); }

.btn-icon-sm {
  background: none;
  border: none;
  font-size: 16px;
  padding: 4px 8px;
  border-radius: 8px;
  transition: background 0.15s;
}

.btn-icon-sm:hover { background: var(--clr-surface2); }
.btn-icon-sm.danger:hover { background: #FF475722; }

.btn-back {
  background: none;
  color: var(--clr-primary);
  font-weight: 700;
  font-size: 14px;
  padding: 6px 0;
}

/* ============================================================
   PAGE HEADERS
   ============================================================ */

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.page-header.with-back {
  gap: 12px;
  justify-content: flex-start;
}

.page-header.with-back .page-title { flex: 1; }

.page-title { font-size: 22px; color: var(--clr-text); }

/* ============================================================
   DASHBOARD
   ============================================================ */

.page-intro {
  margin-bottom: 14px;
}

.date-display {
  font-size: 13px;
  color: var(--clr-text2);
  font-weight: 600;
  margin-bottom: 6px;
}

.motivational-quote {
  background: linear-gradient(135deg, var(--clr-primary), var(--clr-primary-light));
  color: #fff;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  box-shadow: var(--shadow);
}

/* Family Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}

.stat-card {
  background: var(--clr-surface);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--clr-border);
}

.stat-value {
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--clr-primary);
  line-height: 1.1;
}

.stat-label {
  font-size: 10px;
  color: var(--clr-text2);
  font-weight: 700;
  margin-top: 3px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

/* Section Label */
.section-label {
  font-size: 16px;
  color: var(--clr-text2);
  margin-bottom: 10px;
  letter-spacing: 0.3px;
}

/* Child Cards */
.child-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.child-card {
  background: var(--clr-surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--clr-border);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.child-card:hover, .child-card:active {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
  border-color: var(--child-color, var(--clr-primary));
}

.child-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--child-color, var(--clr-primary));
  border-radius: var(--radius) var(--radius) 0 0;
}

.child-card-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.child-ring-wrap {
  position: relative;
  width: 72px;
  height: 72px;
  flex-shrink: 0;
}

.progress-ring {
  width: 72px;
  height: 72px;
}

.ring-bg {
  fill: none;
  stroke: var(--clr-border);
  stroke-width: 5;
}

.ring-fill {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);
}

.child-avatar {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 28px;
  line-height: 1;
}

.child-info { flex: 1; min-width: 0; }

.child-name {
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--clr-text);
  line-height: 1.1;
}

.child-level {
  font-size: 12px;
  color: var(--clr-text2);
  font-weight: 700;
  margin-top: 3px;
}

.child-streak {
  font-size: 12px;
  color: var(--clr-secondary);
  font-weight: 700;
  margin-top: 3px;
}

.child-card-body {}

.today-label {
  font-size: 12px;
  color: var(--clr-text2);
  font-weight: 700;
  margin-bottom: 6px;
}

.progress-bar {
  background: var(--clr-border);
  border-radius: 100px;
  height: 7px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-fill {
  height: 100%;
  border-radius: 100px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}

.child-points-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.points-badge {
  background: var(--clr-gold);
  color: #7A5C00;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.level-progress-wrap { flex: 1; }

.level-progress-bar {
  background: var(--clr-border);
  border-radius: 100px;
  height: 5px;
  overflow: hidden;
}

.level-progress-fill {
  height: 100%;
  border-radius: 100px;
  transition: width 0.5s ease;
}

.all-done-badge {
  position: absolute;
  top: 12px; right: 12px;
  background: var(--clr-gold);
  color: #7A5C00;
  font-size: 11px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 100px;
}

/* Family Challenge Banner */
.family-challenge-banner {
  background: linear-gradient(135deg, #FFD93D22, #FFD93D44);
  border: 1.5px solid var(--clr-gold);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 14px;
}

.challenge-header {
  display: flex;
  justify-content: space-between;
  font-weight: 800;
  margin-bottom: 8px;
  font-size: 14px;
}

.challenge-reward {
  font-size: 12px;
  color: var(--clr-text2);
  margin-top: 6px;
}

.challenge-complete {
  text-align: center;
  font-weight: 800;
  color: #7A5C00;
  margin-top: 6px;
}

.challenge-fill { background: var(--clr-gold) !important; }

/* ============================================================
   CHILD DETAIL
   ============================================================ */

.child-hero {
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 14px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.child-hero-avatar {
  font-size: 52px;
  line-height: 1;
  flex-shrink: 0;
}

.child-hero-stats { flex: 1; }

.hero-name {
  font-family: var(--font-display);
  font-size: 26px;
  color: var(--clr-text);
  line-height: 1;
}

.hero-title {
  font-size: 13px;
  color: var(--clr-text2);
  font-weight: 700;
  margin-top: 4px;
  margin-bottom: 10px;
}

.xp-bar {
  background: rgba(0,0,0,0.12);
  border-radius: 100px;
  height: 8px;
  overflow: hidden;
  margin-top: 4px;
  margin-bottom: 10px;
}

.xp-fill {
  height: 100%;
  border-radius: 100px;
  transition: width 0.6s ease;
}

.hero-stats-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  color: var(--clr-text2);
}

.hero-xp { font-size: 12px; font-weight: 700; color: var(--clr-text2); }

.section-card {
  background: var(--clr-surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  border: 1.5px solid var(--clr-border);
}

.section-title {
  font-size: 16px;
  color: var(--clr-text);
  margin-bottom: 12px;
}

/* Badge Grid */
.badge-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.badge-chip {
  background: var(--clr-gold);
  color: #7A5C00;
  padding: 5px 10px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 800;
}

/* Chore Checklist */
.chore-checklist { display: flex; flex-direction: column; gap: 8px; }

.chore-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--clr-surface2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  border: 1.5px solid var(--clr-border);
  transition: all 0.2s;
}

.chore-item.chore-done {
  opacity: 0.65;
  background: var(--clr-surface);
}

.chore-check {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2.5px solid var(--clr-border);
  background: var(--clr-surface);
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chore-check.checked {
  background: var(--clr-green);
  border-color: var(--clr-green);
  animation: checkPop 0.25s cubic-bezier(0.36,0.07,0.19,0.97);
}

@keyframes checkPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.chore-item-info { flex: 1; min-width: 0; }

.chore-item-name {
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chore-item.chore-done .chore-item-name {
  text-decoration: line-through;
  color: var(--clr-text2);
}

.chore-item-meta {
  font-size: 11px;
  color: var(--clr-text2);
  margin-top: 2px;
}

.chore-points-badge {
  background: var(--clr-border);
  color: var(--clr-text2);
  padding: 3px 8px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  transition: all 0.2s;
}

.chore-points-badge.earned {
  background: var(--clr-gold);
  color: #7A5C00;
}

/* Mini Rewards */
.mini-rewards { display: flex; flex-direction: column; gap: 8px; }

.mini-reward {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--clr-border);
  cursor: pointer;
  transition: all 0.18s;
}

.mini-reward.can-afford {
  border-color: var(--clr-green);
  background: #51CF6611;
  cursor: pointer;
}

.mini-reward.can-afford:hover { transform: translateX(3px); }

.mini-reward.cannot-afford {
  opacity: 0.5;
  cursor: not-allowed;
}

.reward-icon { font-size: 20px; }
.reward-name { flex: 1; font-weight: 700; font-size: 14px; }
.reward-cost { font-weight: 800; font-size: 12px; color: var(--clr-primary); }

/* ============================================================
   QUESTS PAGE
   ============================================================ */

.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.filter-select {
  flex: 1;
  min-width: 120px;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 600;
}

.filter-search {
  flex: 2;
  min-width: 160px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
}

.chore-group { margin-bottom: 20px; }

.chore-group-label {
  font-size: 13px;
  font-weight: 800;
  color: var(--clr-text2);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.quest-card {
  background: var(--clr-surface);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-bottom: 8px;
  border: 1.5px solid var(--clr-border);
  box-shadow: var(--shadow-sm);
}

.quest-card-main {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.quest-icon { font-size: 22px; flex-shrink: 0; }

.quest-info { flex: 1; min-width: 0; }
.quest-name { font-weight: 700; font-size: 14px; }
.quest-meta { font-size: 11px; color: var(--clr-text2); margin-top: 2px; }
.quest-assigned { font-size: 14px; margin-top: 2px; }

.quest-actions { display: flex; gap: 4px; }

.quest-progress-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.assignee-status {
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--clr-surface2);
  border: 1.5px solid var(--clr-border);
  padding: 3px 8px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
}

.assignee-status.done {
  background: #51CF6611;
  border-color: var(--clr-green);
  color: var(--clr-green);
}

.empty-state-card {
  background: var(--clr-surface);
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  color: var(--clr-text2);
  border: 1.5px dashed var(--clr-border);
}

.empty-state {
  color: var(--clr-text3);
  font-size: 13px;
  padding: 12px 0;
  text-align: center;
}

/* ============================================================
   REWARDS PAGE
   ============================================================ */

.child-switcher {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}

.child-tab {
  padding: 8px 16px;
  border-radius: 100px;
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  border: 2px solid var(--clr-border);
  background: var(--clr-surface);
  color: var(--clr-text2);
  transition: all 0.18s;
}

.child-tab.active {
  border-color: transparent;
}

.points-display {

.analytics-highlight {

/* ============================================================

   ============================================================ */

.parent-tabs {

}

.parent-tab {

.parent-tab.active {

}

.approval-item {

.approval-actions { display: flex; gap: 8px; }

.input-inline {

  display: flex;
  justify-content: space-between;

  padding: 10px 0;
  border-bottom: 1px solid var(--clr-border);

}

.setting-row label:first-child {
  font-weight: 700;
  font-size: 14px;
  flex: 1;
}

.setting-row .input-inline { max-width: 180px; }

/* Toggle Switch */
.toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: var(--clr-border);
  border-radius: 24px;
  transition: 0.25s;
}
.toggle-slider:before {
  content: '';
  position: absolute;
  height: 18px; width: 18px;
  left: 3px; bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.25s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.toggle input:checked + .toggle-slider { background: var(--clr-primary); }
.toggle input:checked + .toggle-slider:before { transform: translateX(20px); }

.data-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* ============================================================
   MODAL
   ============================================================ */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 200;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.modal {
  background: var(--clr-surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  /* iOS safe area at bottom */
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: modalSlide 0.25s cubic-bezier(0.4,0,0.2,1);
}

@keyframes modalSlide {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 20px 0;
  position: sticky;
  top: 0;
  background: var(--clr-surface);
  z-index: 1;
}

.modal-header h3 { font-size: 20px; }

.modal-close {
  background: var(--clr-surface2);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 16px;
  font-weight: 800;
  color: var(--clr-text2);
  cursor: pointer;
}

.modal-body { padding: 16px 20px 30px; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 800; color: var(--clr-text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

.modal-input {
  width: 100%;
  padding: 10px 12px;
  font-size: 16px; /* Must be 16px+ to prevent iOS auto-zoom on focus */
  font-weight: 600;
  border-radius: var(--radius-sm);
}

.modal-input:focus {
  outline: none;
  border-color: var(--clr-primary);
  box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

.assign-children {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.assign-child-label {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--clr-surface2);
  border: 1.5px solid var(--clr-border);
  padding: 7px 12px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}

/* :has() replaced with JS-toggled class for broad mobile browser support */
.assign-child-label.is-checked {
  border-color: var(--clr-primary);
  background: rgba(108,99,255,0.08);
  color: var(--clr-primary);
}

.assign-child-label input { width: 16px; height: 16px; accent-color: var(--clr-primary); }

.avatar-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
}

.avatar-option {
  font-size: 30px;
  text-align: center;
  padding: 10px;
  border-radius: var(--radius-sm);
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  background: var(--clr-surface2);
}

.avatar-option:hover {
  border-color: var(--clr-primary);
  transform: scale(1.1);
}

/* ============================================================
   TOAST
   ============================================================ */

.toast-container {
  position: fixed;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 300;
  pointer-events: none;
  width: 100%;
  max-width: 340px;
}

.toast {
  background: var(--clr-surface);
  color: var(--clr-text);
  padding: 12px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 700;
  box-shadow: var(--shadow-lg);
  border: 1.5px solid var(--clr-border);
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  pointer-events: none;
  text-align: center;
  max-width: 320px;
}

.toast.toast-show { transform: translateY(0); opacity: 1; }
.toast-success { border-color: var(--clr-green); }
.toast-error { border-color: var(--clr-secondary); }
.toast-celebration { background: var(--clr-gold); color: #7A5C00; border-color: var(--clr-gold); }
.toast-badge { background: var(--clr-primary); color: #fff; border-color: var(--clr-primary); }

/* ============================================================
   CONFETTI CANVAS
   ============================================================ */

#confetti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 250;
  display: none;
}

/* ============================================================
   UTILITIES
   ============================================================ */

input[type="color"] {
  width: 40px;
  height: 36px;
  padding: 2px;
  border-radius: 8px;
  cursor: pointer;
  border: 1.5px solid var(--clr-border);
  background: var(--clr-surface);
}

/* ============================================================
   PRINT
   ============================================================ */

@media print {
  .app-header, .bottom-nav, .toast-container, #confetti-canvas, .modal-overlay { display: none !important; }
  .app-main { padding: 0; }
  .page { display: block !important; }
  #page-quests { display: block !important; }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (min-width: 480px) {
  .rewards-grid { grid-template-columns: repeat(3, 1fr); }
  .child-cards { display: grid; grid-template-columns: 1fr 1fr; }
}

@media (min-width: 768px) {
  .app-main { max-width: 700px; margin: 0 auto; }
  .child-cards { grid-template-columns: 1fr 1fr; }
  .stats-grid { grid-template-columns: repeat(4, 1fr); }
}

/* ============================================================

// Resize & compress a photo to base64 (max 256px, JPEG 80%)
function compressPhoto(file, callback) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 256;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width  = Math.round(img.width  * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.80));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function uid() {

function getTodayStr() {

}

function dateToStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateShort(dateStr) {
  const [y,m,day] = dateStr.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[m-1]} ${day}`;
}

let state;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      const def = getDefaultState();
      // Deep merge: saved wins, but fill in missing keys from default
      state = deepMerge(def, saved);
      // Ensure earnedBadges has entries for all current children
      state.children.forEach(c => {
        if (!state.earnedBadges[c.id]) state.earnedBadges[c.id] = [];
      });
      if (!state.bonusPoints) state.bonusPoints = [];
    } else {
      state = getDefaultState();
    }
  } catch (e) {
    console.warn('State load error, using defaults', e);
    state = getDefaultState();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    showToast('Storage full — consider exporting and clearing old data', 'error');
  }
}

function deepMerge(def, saved) {
  const result = Object.assign({}, def);
  for (const key in saved) {
    if (saved[key] === null || saved[key] === undefined) continue;
    if (Array.isArray(saved[key])) {
      result[key] = saved[key];
    } else if (typeof saved[key] === 'object') {
      result[key] = deepMerge(def[key] || {}, saved[key]);
    } else {
      result[key] = saved[key];
    }
  }
  return result;
}

function getChoreXP(childId) {
  // XP from completed chores only (used for level tracking — never goes down)
  return state.completions
    .filter(c => c.childId === childId)
    .reduce((sum, c) => {
      const chore = getChoreById(c.choreId);
      return sum + (chore ? chore.points : 0);
    }, 0);
}

function getBonusBalance(childId) {
  return (state.bonusPoints || [])
    .filter(b => b.childId === childId)
    .reduce((sum, b) => sum + b.points, 0);
}

function getTotalSpent(childId) {
  return state.redemptions
    .filter(r => r.childId === childId && r.approved)
    .reduce((sum, r) => {
      const reward = getRewardById(r.rewardId);
      return sum + (reward ? reward.pointCost : 0);
    }, 0);
}

function getAvailablePoints(childId) {
  return Math.max(0, getChoreXP(childId) + getBonusBalance(childId) - getTotalSpent(childId));
}

function getCompletionCount(childId) {
  return state.completions.filter(c => c.childId === childId).length;
}

function getCategoryCount(childId, category) {
  return state.completions.filter(c => {
    const chore = getChoreById(c.choreId);
    return c.childId === childId && chore && chore.category === category;
  }).length;
}

function isChoreCompletedToday(choreId, childId) {
  const today = getTodayStr();
  return state.completions.some(c => c.choreId === choreId && c.childId === childId && c.date === today);
}

function getDailyChoresForChild(childId) {
  // Regular daily chores + unclaimed grab quests (daily)
  return state.chores.filter(c =>
    c.recurrence === 'daily' &&
    (c.assignedTo.includes(childId) || (c.upForGrabs && !getGrabClaimedBy(c.id)))
  );
}

function getAllChoresForChild(childId) {
  return state.chores.filter(c => c.assignedTo.includes(childId));
}

// Returns the childId who claimed a grab quest today/this week, or null
function getGrabClaimedBy(choreId) {
  const chore = getChoreById(choreId);
  if (!chore) return null;
  const today = getTodayStr();
  if (chore.recurrence === 'weekly') {
    // Find any completion this calendar week (Mon–Sun)
    const now = new Date();
    const dayOfWeek = (now.getDay() + 6) % 7; // 0=Mon
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - dayOfWeek);
    const weekStartStr = dateToStr(weekStart);
    const c = state.completions.find(c => c.choreId === choreId && c.date >= weekStartStr);
    return c ? c.childId : null;
  }
  // Daily: today only
  const c = state.completions.find(c => c.choreId === choreId && c.date === today);
  return c ? c.childId : null;
}

function isGrabQuestDoneByChild(choreId, childId) {
  const chore = getChoreById(choreId);
  if (!chore) return false;
  if (chore.recurrence === 'weekly') {
    const now = new Date();
    const dayOfWeek = (now.getDay() + 6) % 7;
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - dayOfWeek);
    const weekStartStr = dateToStr(weekStart);
    return state.completions.some(c => c.choreId === choreId && c.childId === childId && c.date >= weekStartStr);
  }
  return isChoreCompletedToday(choreId, childId);
}

// All up-for-grabs quests
function getGrabQuests() {
  return state.chores.filter(c => c.upForGrabs);
}

function getTodayCompletionsForChild(childId) {
  const today = getTodayStr();
  return state.completions.filter(c => c.childId === childId && c.date === today).length;
}

function getStreak(childId) {
  const dailyChores = getDailyChoresForChild(childId);
  if (dailyChores.length === 0) return 0;
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const check = new Date(today);
    check.setDate(today.getDate() - i);
    const dateStr = dateToStr(check);
    const allDone = dailyChores.every(chore =>
      state.completions.some(c => c.choreId === chore.id && c.childId === childId && c.date === dateStr)
    );
    if (allDone) {
      streak++;
    } else {
      // Today not done yet is OK for streak continuity check from yesterday
      if (i > 0) break;
    }
  }
  return streak;
}

function getWeeklyCompletionPct(childId) {
  const dailyChores = getDailyChoresForChild(childId);
  if (dailyChores.length === 0) return 0;
  let required = 0, completed = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = dateToStr(d);
    required += dailyChores.length;
    completed += dailyChores.filter(ch =>
      state.completions.some(c => c.choreId === ch.id && c.childId === childId && c.date === ds)
    ).length;
  }
  return required > 0 ? Math.round((completed / required) * 100) : 0;
}

function getLevel(xp) {
  let lv = 1;
  for (let i = LEVEL_THRESHOLDS.length - 1; i >= 0; i--) {
    if (xp >= LEVEL_THRESHOLDS[i]) { lv = i + 1; break; }
  }
  return Math.min(lv, LEVEL_TITLES.length);
}

function getLevelTitle(lv) {
  return LEVEL_TITLES[Math.min(lv - 1, LEVEL_TITLES.length - 1)];
}

function getLevelProgress(xp) {
  const lv = getLevel(xp);
  const cur = LEVEL_THRESHOLDS[lv - 1] || 0;
  const next = LEVEL_THRESHOLDS[lv] || LEVEL_THRESHOLDS[LEVEL_THRESHOLDS.length - 1];
  return next === cur ? 1 : Math.min(1, (xp - cur) / (next - cur));
}

function getFamilyTotalToday() {
  return state.completions.filter(c => c.date === getTodayStr()).length;
}

function getFamilyWeeklyPct() {
  const pcts = state.children.map(c => getWeeklyCompletionPct(c.id));
  if (!pcts.length) return 0;
  return Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length);
}

function getFamilyTotalXP() {
  return state.children.reduce((sum, c) => sum + getChoreXP(c.id), 0);
}

function getBestStreak() {
  return Math.max(0, ...state.children.map(c => getStreak(c.id)));
}

function getLast7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(dateToStr(d));
  }
  return days;
}

// BADGE CHECKING
// ============================================================

function checkBadges(childId) {
  const earned = state.earnedBadges[childId] || [];
  const xp = getChoreXP(childId);
  const count = getCompletionCount(childId);
  const streak = getStreak(childId);
  const lv = getLevel(xp);
  const daily = getDailyChoresForChild(childId);
  const todayDone = getTodayCompletionsForChild(childId);
  const allDailyDone = daily.length > 0 && daily.every(ch => isChoreCompletedToday(ch.id, childId));

  const checks = {
    first_quest:    count >= 1,
    streak_3:       streak >= 3,
    streak_7:       streak >= 7,
    streak_30:      streak >= 30,
    xp_100:         xp >= 100,
    xp_500:         xp >= 500,
    xp_1000:        xp >= 1000,
    quests_10:      count >= 10,
    quests_50:      count >= 50,
    quests_100:     count >= 100,
    perfect_day:    allDailyDone,
    level_5:        lv >= 5,
    level_10:       lv >= 10,
    bedroom_boss:   getCategoryCount(childId, 'bedroom') >= 5,
    kitchen_master: getCategoryCount(childId, 'kitchen') >= 5,
    pet_pal:        getCategoryCount(childId, 'pets') >= 5
  };

  const newBadges = [];
  for (const [id, condition] of Object.entries(checks)) {
    if (condition && !earned.includes(id)) {
      earned.push(id);
      newBadges.push(id);
    }
  }
  state.earnedBadges[childId] = earned;
  return newBadges;
}

// ============================================================
// PASSWORD CRYPTO (PBKDF2 via Web Crypto API)
// Passwords are never stored in plain text.
// Stored as: { hash: base64, salt: base64 }
// ============================================================

async function hashPassword(plaintext, saltBytes) {
  const enc  = new TextEncoder();
  const key  = await crypto.subtle.importKey('raw', enc.encode(plaintext),
    { name: 'PBKDF2' }, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: saltBytes, iterations: 200000, hash: 'SHA-256' },
    key, 256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}

async function makePasswordRecord(plaintext) {
  const saltBytes = crypto.getRandomValues(new Uint8Array(16));
  const salt = btoa(String.fromCharCode(...saltBytes));
  const hash = await hashPassword(plaintext, saltBytes);
  return { hash, salt };
}

async function verifyPassword(plaintext, record) {
  if (!record || !record.hash || !record.salt) return false;
  const saltBytes = Uint8Array.from(atob(record.salt), c => c.charCodeAt(0));
  const hash = await hashPassword(plaintext, saltBytes);
  return hash === record.hash;
}

// Called once on first load to migrate any plain-text password to hashed form
async function migratePassword() {
  const s = state.settings;
  // Already hashed
  if (s.passwordRecord && s.passwordRecord.hash) return;
  // Has legacy plain text password — hash it now
  const plain = s.parentPassword || '1234';
  s.passwordRecord = await makePasswordRecord(plain);
  delete s.parentPassword;  // wipe plain text
  saveState();
}

let currentPage = 'dashboard';
let selectedChildId = null;
let isParentMode = false;
let chartInstances = {};

function navigate(page, options = {}) {
  // Destroy existing charts
  Object.values(chartInstances).forEach(ch => { try { ch && ch.destroy && ch.destroy(); } catch(e){} });
  chartInstances = {};

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  const pageEl = document.getElementById('page-' + page);
  if (pageEl) pageEl.classList.add('active');

  const navBtn = document.querySelector('.nav-btn[data-page="' + page + '"]');
  if (navBtn) navBtn.classList.add('active');

  currentPage = page;
  window.scrollTo(0, 0);

  switch (page) {
    case 'dashboard': renderDashboard(); break;
    case 'child':
      selectedChildId = options.childId;
      renderChildDetail(options.childId);
      break;
    case 'quests':   renderQuests();   break;
    case 'rewards':  renderRewards();  break;
    case 'calendar': renderCalendar(); break;
    case 'reports':  renderReports();  break;
    case 'parent':   renderParentMode(); break;
  }
}

function toggleChore(choreId, childId) {
  const done = isChoreCompletedToday(choreId, childId);
  if (done) {
    // Undo
    const today = getTodayStr();
    state.completions = state.completions.filter(c =>
      !(c.choreId === choreId && c.childId === childId && c.date === today)
    );
    saveState();
    renderChildDetail(childId);
    return;
  }

  const chore = getChoreById(choreId);
  if (!chore) return;

  state.completions.push({ id: uid(), choreId, childId, date: getTodayStr(), timestamp: Date.now() });

  const newBadges = checkBadges(childId);
  saveState();

  playSound('complete');
  showToast('⚡ +' + chore.points + ' XP earned!', 'success');

  // Check if all daily done
  const daily = getDailyChoresForChild(childId);
  const child = getChildById(childId);
  if (daily.length > 0 && daily.every(ch => isChoreCompletedToday(ch.id, childId))) {
    setTimeout(() => {
      launchConfetti();
      showToast('🎉 ' + child.name + ' finished all daily quests!', 'celebration');
    }, 350);
  }

  // Badge notifications
  newBadges.forEach((bId, i) => {
    const b = BADGES_DEF.find(x => x.id === bId);
    if (b) setTimeout(() => showToast('🏅 New badge: ' + b.name + '!', 'badge'), 700 + i * 500);
  });

  renderChildDetail(childId);
}

function claimGrabQuest(choreId, childId) {
  const chore = getChoreById(choreId);
  if (!chore || !chore.upForGrabs) return;
  // Check if already claimed by someone
  const claimedBy = getGrabClaimedBy(choreId);
  if (claimedBy) {
    const claimer = getChildById(claimedBy);
    if (claimedBy === childId) {
      showToast('You already claimed this quest!', 'info');
    } else {
      showToast(`${claimer ? claimer.name : 'Someone'} already claimed this one!`, 'error');
    }
    return;
  }
  // Claim it!
  state.completions.push({ id: uid(), choreId, childId, date: getTodayStr(), timestamp: Date.now() });
  const newBadges = checkBadges(childId);
  saveState();
  playSound('complete');
  showToast(`⚡ +${chore.points} pts — ${chore.name} claimed!`, 'celebration');
  newBadges.forEach((bId, i) => {
    const b = BADGES_DEF.find(x => x.id === bId);
    if (b) setTimeout(() => showToast('🏅 New badge: ' + b.name + '!', 'badge'), 700 + i * 500);
  });
  if (currentPage === 'child') renderChildDetail(childId);
  if (currentPage === 'dashboard') renderDashboard();
}

function redeemRewardDirect(rewardId, childId) {
  const reward = getRewardById(rewardId);
  const avail = getAvailablePoints(childId);
  if (!reward || avail < reward.pointCost) return;
  if (!confirm('Redeem "' + reward.name + '" for ' + reward.pointCost + ' points?')) return;
  state.redemptions.push({ id: uid(), rewardId, childId, date: getTodayStr(), approved: false });
  saveState();
  showToast('🎁 ' + reward.name + ' requested! Parent approval needed.', 'success');
  renderChildDetail(childId);
}

    state.children.map(c => '<option value="' + c.id + '">' + c.avatar + ' ' + c.name + '</option>').join('');
  filterChild.value = choreFilters.child;
  document.getElementById('filter-category').value = choreFilters.category;
  document.getElementById('chore-search').value = choreFilters.search;
  renderChoreList();
}

function renderChoreList() {
  let chores = [...state.chores];
  if (choreFilters.child !== 'all')    chores = chores.filter(c => c.assignedTo.includes(choreFilters.child));
  if (choreFilters.category !== 'all') chores = chores.filter(c => c.category === choreFilters.category);
  if (choreFilters.search) {
    const q = choreFilters.search.toLowerCase();
    chores = chores.filter(c => c.name.toLowerCase().includes(q) || (c.description||'').toLowerCase().includes(q));
  }

  const container = document.getElementById('chore-list');
  if (chores.length === 0) {
    container.innerHTML = '<div class="empty-state-card"><p>No quests found. Add one above!</p></div>';
    return;
  }

  // Separate grab quests from regular quests
  const grabChores = chores.filter(c => c.upForGrabs);
  const regularChores = chores.filter(c => !c.upForGrabs);
  const groups = { daily: [], weekly: [], monthly: [] };
  regularChores.forEach(c => { if (groups[c.recurrence]) groups[c.recurrence].push(c); });

  // Build grab section HTML
  const grabSection = grabChores.length ? `
    <div class="chore-group">
      <div class="chore-group-label" style="color:var(--clr-gold)">⚡ up for grabs</div>
      <div class="grab-banner" style="margin-bottom:8px">First child to tap it claims the points for the day/week!</div>
      ${grabChores.map(ch => {
        const claimedBy = getGrabClaimedBy(ch.id);
        const claimer = claimedBy ? getChildById(claimedBy) : null;
        const cat = CATEGORY_INFO[ch.category] || { icon: '📌' };
        return `
        <div class="quest-card" style="border-color:var(--clr-gold)22">
          <div class="quest-card-main">
            <div class="quest-icon">${cat.icon}</div>
            <div class="quest-info">
              <div class="quest-name">${ch.name} <span style="font-size:11px;background:var(--clr-gold);color:#7A5C00;padding:2px 6px;border-radius:100px;font-weight:800">UP FOR GRABS</span></div>
              <div class="quest-meta">⚡${ch.points} pts · ⏱${ch.estimatedTime}min · ${ch.recurrence}</div>
              ${claimer ? `<div class="quest-meta" style="color:var(--clr-green);font-weight:800">✓ Claimed by ${claimer.avatar} ${claimer.name}</div>` : '<div class="quest-meta" style="color:var(--clr-gold);font-weight:800">🔓 Available now!</div>'}
            </div>
            <div class="quest-actions">
              ${isParentMode ? `
              <button class="btn-icon-sm" onclick="openChoreModal('${ch.id}')">✏️</button>
              <button class="btn-icon-sm danger" onclick="deleteChore('${ch.id}')">🗑️</button>` : ''}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>` : '';

  container.innerHTML = grabSection + Object.entries(groups).map(([rec, list]) => {
    if (!list.length) return '';
    return `
    <div class="chore-group">
      <div class="chore-group-label">${rec}</div>
      ${list.map(ch => {
        const cat  = CATEGORY_INFO[ch.category] || { icon: '📌' };
        const completions = ch.assignedTo.map(cId => ({
          child: getChildById(cId),
          done:  isChoreCompletedToday(ch.id, cId)
        }));
        return `
        <div class="quest-card">
          <div class="quest-card-main">
            <div class="quest-icon">${cat.icon}</div>
            <div class="quest-info">
              <div class="quest-name">${ch.name}</div>
              <div class="quest-meta">⚡${ch.points} pts · ⏱${ch.estimatedTime}min · ${ch.difficulty}</div>
            </div>
            <div class="quest-actions">
              ${isParentMode ? `
              <button class="btn-icon-sm" onclick="openChoreModal('${ch.id}')">✏️</button>
              <button class="btn-icon-sm danger" onclick="deleteChore('${ch.id}')">🗑️</button>
              ` : ''}
            </div>
          </div>
          <div class="quest-progress-row">
            ${completions.map(({child, done}) => child ? `
            <div class="assignee-status ${done ? 'done' : ''}">
              ${child.avatar} ${done ? '✓' : '○'}
            </div>` : '').join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

function deleteChore(choreId) {
  if (!confirm('Delete this quest?')) return;
  state.chores = state.chores.filter(c => c.id !== choreId);
  saveState();
  renderChoreList();
  showToast('Quest deleted', 'info');
}

let rewardsChildId = null;

function renderRewards() {
  if (!rewardsChildId || !getChildById(rewardsChildId)) {
    rewardsChildId = state.children[0] ? state.children[0].id : null;
  }

  const switcher = document.getElementById('rewards-child-switcher');

      <button class="child-tab ${rewardsChildId === c.id ? 'active' : ''}"

        ${c.photo ? `<img src="${c.photo}" style="width:18px;height:18px;border-radius:50%;object-fit:cover;vertical-align:middle">` : c.avatar} ${c.name}

function renderFamilyRewardsContent() {
  const totalXP  = getFamilyTotalXP();
  const pending  = (state.familyRedemptions || []).filter(r => !r.approved);
  const history  = (state.familyRedemptions || []).slice().reverse().slice(0, 8);

  document.getElementById('rewards-content').innerHTML = `
    <div class="points-display" style="background:linear-gradient(135deg,var(--clr-primary),var(--clr-secondary))">

      <div class="points-label">Family XP Pool</div>

    </div>
    ${pending.length ? `<div class="pending-section"><h3>⏳ Pending Approval</h3>${pending.map(r => { const rw = getFamilyRewardById(r.rewardId); return rw ? `<div class="pending-item">${rw.icon} ${rw.name} — waiting for parent</div>` : ''; }).join('')}</div>` : ''}
    <div class="rewards-grid">
      ${(state.familyRewards || []).map(r => {
        const can = totalXP >= r.pointCost;
        return `
        <div class="reward-card ${can ? 'affordable' : 'locked'}">
          <div class="reward-icon-lg">${r.icon}</div>
          <div class="reward-name">${r.name}</div>
          <div class="reward-desc">${r.description}</div>
          <div class="reward-cost">🏠 ${r.pointCost} XP</div>
          <button class="btn-redeem ${can ? '' : 'disabled'}"

            ${can ? '🎁 Redeem' : 'Need ' + (r.pointCost - totalXP) + ' more'}
          </button>

        </div>`;
      }).join('')}

    ${isParentMode ? `<div style="margin-bottom:16px"><button class="btn-primary" onclick="openFamilyRewardModal()">+ Family Reward</button></div>` : ''}

      <h3>📜 Family History</h3>
      ${history.length === 0 ? '<p class="empty-state">No family redemptions yet</p>' : history.map(r => {
        const rw = getFamilyRewardById(r.rewardId);
        return rw ? `<div class="history-item"><span>${rw.icon} ${rw.name}</span><span class="${r.approved ? 'approved' : 'pending'}">${r.approved ? '✓ Approved' : '⏳ Pending'}</span><span>${formatDateShort(r.date)}</span></div>` : '';

function switchRewardChild(childId) {
  rewardsChildId = childId;
  renderRewards();
}

function renderRewardsContent(childId) {
  const child   = getChildById(childId);
  if (!child) return;
  const avail   = getAvailablePoints(childId);
  const pending = state.redemptions.filter(r => r.childId === childId && !r.approved);
  const history = state.redemptions.filter(r => r.childId === childId).slice().reverse().slice(0, 10);

  document.getElementById('rewards-content').innerHTML = `
    <div class="points-display" style="background:${child.color}">
      <div class="points-amount">⚡ ${avail}</div>
      <div class="points-label">Available Points</div>
    </div>
    ${pending.length > 0 ? `
    <div class="pending-section">
      <h3>⏳ Pending Approval</h3>
      ${pending.map(r => { const rw = getRewardById(r.rewardId); return rw ? '<div class="pending-item">' + rw.icon + ' ' + rw.name + ' — waiting for parent</div>' : ''; }).join('')}
    </div>` : ''}
    <div class="rewards-grid">
      ${state.rewards.map(r => {
        const can = avail >= r.pointCost;
        return `
        <div class="reward-card ${can ? 'affordable' : 'locked'}">
          <div class="reward-icon-lg">${r.icon}</div>
          <div class="reward-name">${r.name}</div>
          <div class="reward-desc">${r.description}</div>
          <div class="reward-cost">⚡ ${r.pointCost} pts</div>
          <button class="btn-redeem ${can ? '' : 'disabled'}"
                  onclick="${can ? 'redeemReward(\'' + r.id + '\',\'' + childId + '\')' : ''}">
            ${can ? '🎁 Redeem' : 'Need ' + (r.pointCost - avail) + ' more'}
          </button>
          ${isParentMode ? `
          <button class="btn-icon-sm" onclick="openRewardModal('${r.id}')" style="margin-top:4px">✏️ Edit</button>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="redemption-history">
      <h3>📜 History</h3>
      ${history.length === 0 ? '<p class="empty-state">No redemptions yet</p>' : history.map(r => {
        const rw = getRewardById(r.rewardId);
        return rw ? `
        <div class="history-item">
          <span>${rw.icon} ${rw.name}</span>
          <span class="${r.approved ? 'approved' : 'pending'}">${r.approved ? '✓ Approved' : '⏳ Pending'}</span>
          <span>${formatDateShort(r.date)}</span>
        </div>` : '';
      }).join('')}
    </div>
  `;
}

function redeemReward(rewardId, childId) {
  const reward = getRewardById(rewardId);
  const avail  = getAvailablePoints(childId);
  if (!reward || avail < reward.pointCost) return;
  if (!confirm('Redeem "' + reward.name + '" for ' + reward.pointCost + ' points?')) return;
  state.redemptions.push({ id: uid(), rewardId, childId, date: getTodayStr(), approved: false });
  saveState();
  showToast('🎁 ' + reward.name + ' requested!', 'success');
  renderRewardsContent(childId);
}

let calDate = new Date();

function renderCalendar() {
  const year  = calDate.getFullYear();
  const month = calDate.getMonth();
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent = MONTHS[month] + ' ' + year;

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay    = new Date(year, month, 1).getDay();
  const today       = getTodayStr();

  let html = '<div class="cal-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    html += '<div class="cal-header-cell">' + d + '</div>';
  });

  for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell empty"></div>';

  const familyDailyTotal = state.children.reduce((sum, ch) => sum + getDailyChoresForChild(ch.id).length, 0);

  for (let day = 1; day <= daysInMonth; day++) {
    const ds   = year + '-' + String(month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    const comp = state.completions.filter(c => c.date === ds).length;
    const isToday = ds === today;
    let dotClass = '';
    if (comp > 0 && familyDailyTotal > 0) {
      const r = comp / familyDailyTotal;
      dotClass = r >= 0.8 ? 'dot-great' : r >= 0.5 ? 'dot-ok' : 'dot-low';
    }
    html += `
    <div class="cal-cell ${isToday ? 'today' : ''}" onclick="showCalDay('${ds}')">
      <div class="cal-day">${day}</div>
      ${comp > 0 ? '<div class="cal-dot ' + dotClass + '"></div>' : ''}
      ${comp > 0 ? '<div class="cal-count">' + comp + '</div>' : ''}
    </div>`;
  }
  html += '</div>';
  document.getElementById('calendar-grid').innerHTML = html;
  showCalDay(today);
}

function showCalDay(dateStr) {
  const comps  = state.completions.filter(c => c.date === dateStr);
  const redems = state.redemptions.filter(r => r.date === dateStr);
  const detail = document.getElementById('calendar-day-detail');

  if (!comps.length && !redems.length) {
    detail.innerHTML = '<div class="cal-detail"><p class="empty-state">' +
      (dateStr === getTodayStr() ? 'No activity yet today' : 'No activity on this day') + '</p></div>';
    return;
  }

  detail.innerHTML = `
  <div class="cal-detail">
    <h3>${formatDateShort(dateStr)}</h3>
    ${comps.map(c => {
      const ch = getChoreById(c.choreId), kid = getChildById(c.childId);
      return ch && kid ? `
      <div class="cal-detail-item">
        <span>${kid.avatar} ${kid.name}</span>
        <span>✓ ${ch.name}</span>
        <span>+${ch.points} XP</span>
      </div>` : '';
    }).join('')}
    ${redems.map(r => {
      const rw = getRewardById(r.rewardId), kid = getChildById(r.childId);
      return rw && kid ? `
      <div class="cal-detail-item redemption">
        <span>${kid.avatar} ${kid.name}</span>
        <span>${rw.icon} ${rw.name}</span>
        <span>-${rw.pointCost} pts</span>
      </div>` : '';
    }).join('')}
  </div>`;
}

// NATIVE SVG CHARTS (no Chart.js dependency)
// ============================================================

function svgBarChart(data, options = {}) {
  const { labels = [], colors = [], title = '', yMax } = options;
  const W = 320, H = 180, PAD = { t: 10, r: 10, b: 40, l: 36 };
  const plotW = W - PAD.l - PAD.r;
  const plotH = H - PAD.t - PAD.b;
  const maxVal = yMax || Math.max(...data.map(d => Math.max(...d.values)), 1);
  const numGroups = labels.length;
  const numSeries = data.length;
  const groupW = plotW / numGroups;
  const barW = Math.max(4, (groupW / (numSeries + 0.5)) - 2);
  const scale = plotH / maxVal;

  let bars = '';
  labels.forEach((label, gi) => {
    data.forEach((series, si) => {
      const val = series.values[gi] || 0;
      const x = PAD.l + gi * groupW + si * (barW + 2) + (groupW - numSeries * (barW + 2)) / 2;
      const barH = val * scale;
      const y = PAD.t + plotH - barH;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${Math.max(0, barH).toFixed(1)}"
        fill="${colors[si % colors.length]}CC" rx="3" title="${series.label}: ${val}"/>`;
      if (val > 0) bars += `<text x="${(x + barW/2).toFixed(1)}" y="${(y - 3).toFixed(1)}"
        text-anchor="middle" font-size="9" fill="var(--clr-text2)">${val}</text>`;
    });
    // x label
    const lx = PAD.l + gi * groupW + groupW / 2;
    bars += `<text x="${lx.toFixed(1)}" y="${(H - PAD.b + 14).toFixed(1)}"
      text-anchor="middle" font-size="10" fill="var(--clr-text2)">${label}</text>`;
  });

  // y axis ticks
  let yTicks = '';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = Math.round(maxVal * i / ticks);
    const y = PAD.t + plotH - v * scale;
    yTicks += `<line x1="${PAD.l}" y1="${y.toFixed(1)}" x2="${W - PAD.r}" y2="${y.toFixed(1)}"
      stroke="var(--clr-border)" stroke-width="1"/>`;
    yTicks += `<text x="${PAD.l - 4}" y="${(y + 4).toFixed(1)}"
      text-anchor="end" font-size="9" fill="var(--clr-text3)">${v}</text>`;
  }

  // Legend
  let legend = '';
  data.forEach((s, i) => {
    const lx = PAD.l + i * 80;
    legend += `<rect x="${lx}" y="${H - 8}" width="10" height="10" fill="${colors[i % colors.length]}CC" rx="2"/>`;
    legend += `<text x="${lx + 13}" y="${H - 1}" font-size="10" fill="var(--clr-text2)">${s.label}</text>`;
  });

  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <svg viewBox="0 0 ${W} ${H + (data.length > 1 ? 16 : 0)}" width="100%" style="min-width:260px;display:block">
      ${yTicks}${bars}${data.length > 1 ? legend : ''}
    </svg></div>`;
}

function svgLineChart(data, options = {}) {
  const { labels = [], colors = [] } = options;
  const W = 320, H = 160, PAD = { t: 10, r: 10, b: 38, l: 36 };
  const plotW = W - PAD.l - PAD.r;
  const plotH = H - PAD.t - PAD.b;
  const allVals = data.flatMap(d => d.values);
  const maxVal = Math.max(...allVals, 1);
  const scale = plotH / maxVal;
  const stepX = labels.length > 1 ? plotW / (labels.length - 1) : plotW;

  let paths = '';
  data.forEach((series, si) => {
    const color = colors[si % colors.length];
    const pts = series.values.map((v, i) => {
      const x = PAD.l + i * stepX;
      const y = PAD.t + plotH - v * scale;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const area = `M${PAD.l},${PAD.t + plotH} ` +
      series.values.map((v, i) => `L${(PAD.l + i * stepX).toFixed(1)},${(PAD.t + plotH - v * scale).toFixed(1)}`).join(' ') +
      ` L${(PAD.l + (series.values.length - 1) * stepX).toFixed(1)},${PAD.t + plotH} Z`;
    paths += `<path d="${area}" fill="${color}22"/>`;
    paths += `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    series.values.forEach((v, i) => {
      if (v > 0) {
        const x = PAD.l + i * stepX;
        const y = PAD.t + plotH - v * scale;
        paths += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"/>`;
      }
    });
  });

  // x labels
  let xlabels = '';
  labels.forEach((label, i) => {
    const x = PAD.l + i * stepX;
    xlabels += `<text x="${x.toFixed(1)}" y="${H - PAD.b + 14}" text-anchor="middle" font-size="10" fill="var(--clr-text2)">${label}</text>`;
  });

  // y ticks
  let yTicks = '';
  for (let i = 0; i <= 4; i++) {
    const v = Math.round(maxVal * i / 4);
    const y = PAD.t + plotH - v * scale;
    yTicks += `<line x1="${PAD.l}" y1="${y.toFixed(1)}" x2="${W - PAD.r}" y2="${y.toFixed(1)}" stroke="var(--clr-border)" stroke-width="1"/>`;
    yTicks += `<text x="${PAD.l - 4}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--clr-text3)">${v}</text>`;
  }

  // Legend
  let legend = '';
  data.forEach((s, i) => {
    const lx = PAD.l + i * 80;
    legend += `<rect x="${lx}" y="${H + 4}" width="10" height="10" fill="${colors[i % colors.length]}CC" rx="2"/>`;
    legend += `<text x="${lx + 13}" y="${H + 12}" font-size="10" fill="var(--clr-text2)">${s.label}</text>`;
  });

  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <svg viewBox="0 0 ${W} ${H + (data.length > 1 ? 18 : 0)}" width="100%" style="min-width:260px;display:block">
      ${yTicks}${paths}${xlabels}${data.length > 1 ? legend : ''}
    </svg></div>`;
}

function svgDonutChart(values, labels, colors) {
  const W = 200, CX = 100, CY = 90, R = 70, IR = 44;
  const total = values.reduce((a, b) => a + b, 0) || 1;
  let startAngle = -Math.PI / 2;
  let slices = '';
  values.forEach((val, i) => {
    const angle = (val / total) * 2 * Math.PI;
    const endAngle = startAngle + angle;
    const x1 = CX + R * Math.cos(startAngle), y1 = CY + R * Math.sin(startAngle);
    const x2 = CX + R * Math.cos(endAngle),   y2 = CY + R * Math.sin(endAngle);
    const ix1 = CX + IR * Math.cos(startAngle), iy1 = CY + IR * Math.sin(startAngle);
    const ix2 = CX + IR * Math.cos(endAngle),   iy2 = CY + IR * Math.sin(endAngle);
    const large = angle > Math.PI ? 1 : 0;
    slices += `<path d="M${ix1.toFixed(1)},${iy1.toFixed(1)} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 ${large},1 ${x2.toFixed(1)},${y2.toFixed(1)} L${ix2.toFixed(1)},${iy2.toFixed(1)} A${IR},${IR} 0 ${large},0 ${ix1.toFixed(1)},${iy1.toFixed(1)} Z"
      fill="${colors[i % colors.length]}CC" stroke="var(--clr-surface)" stroke-width="2"/>`;
    // label
    const midA = startAngle + angle / 2;
    const lx = CX + (R + 10) * Math.cos(midA), ly = CY + (R + 10) * Math.sin(midA);
    if (val > 0) slices += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--clr-text)">${Math.round(val)}%</text>`;
    startAngle = endAngle;
  });

  let legend = '';
  labels.forEach((lbl, i) => {
    legend += `<rect x="10" y="${180 + i * 18}" width="12" height="12" fill="${colors[i % colors.length]}CC" rx="3"/>`;
    legend += `<text x="26" y="${190 + i * 18}" font-size="11" fill="var(--clr-text2)">${lbl}</text>`;
  });

  const totalH = 175 + labels.length * 18 + 8;
  return `<div style="overflow-x:auto">
    <svg viewBox="0 0 ${W} ${totalH}" width="100%" style="max-width:280px;display:block;margin:0 auto">
      ${slices}${legend}
    </svg></div>`;
}

function buildWeeklyCompletionsChart() {
  const days = getLast7Days();
  const labels = days.map(d => new Date(d + 'T12:00').toLocaleDateString('en-US', { weekday: 'short' }));
  const data = state.children.map((c, i) => ({
    label: c.name,
    values: days.map(d => state.completions.filter(x => x.childId === c.id && x.date === d).length)
  }));
  const el = document.getElementById('ch-weekly');
  if (el) el.innerHTML = svgBarChart(data, { labels, colors: state.children.map(c => c.color) });
}

function buildWeeklyXPChart() {
  const days = getLast7Days();
  const labels = days.map(d => new Date(d + 'T12:00').toLocaleDateString('en-US', { weekday: 'short' }));
  const data = state.children.map(c => ({
    label: c.name,
    values: days.map(d => state.completions
      .filter(x => x.childId === c.id && x.date === d)
      .reduce((s, x) => { const ch = getChoreById(x.choreId); return s + (ch ? ch.points : 0); }, 0))
  }));
  const el = document.getElementById('ch-pts-weekly');
  if (el) el.innerHTML = svgLineChart(data, { labels, colors: state.children.map(c => c.color) });
}

function buildMonthlyChart() {
  const today = new Date();
  const year = today.getFullYear(), month = today.getMonth();
  const days = new Date(year, month + 1, 0).getDate();
  const labels = Array.from({ length: days }, (_, i) => (i + 1) % 5 === 0 ? String(i + 1) : '');
  const data = state.children.map(c => {
    let running = 0;
    return {
      label: c.name,
      values: Array.from({ length: days }, (_, i) => {
        const ds = year + '-' + String(month+1).padStart(2,'0') + '-' + String(i+1).padStart(2,'0');
        running += state.completions.filter(x => x.childId === c.id && x.date === ds).length;
        return running;
      })
    };
  });
  const el = document.getElementById('ch-monthly');
  if (el) el.innerHTML = svgLineChart(data, { labels, colors: state.children.map(c => c.color) });
}

function buildLeaderboardChart() {
  const el = document.getElementById('ch-lb');
  if (!el) return;
  const data = [{ label: 'XP', values: state.children.map(c => getChoreXP(c.id)) }];
  el.innerHTML = svgBarChart(data, { labels: state.children.map(c => c.avatar + ' ' + c.name), colors: state.children.map(c => c.color) });
}

function buildCompletionRateChart() {
  const el = document.getElementById('ch-rates');
  if (!el) return;
  el.innerHTML = svgDonutChart(
    state.children.map(c => getWeeklyCompletionPct(c.id)),
    state.children.map(c => c.name),
    state.children.map(c => c.color)
  );
}

let activeTab = 'weekly';

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));

function renderReportTab(tab) {
  activeTab = tab;
  Object.values(chartInstances).forEach(c => { try { c && c.destroy && c.destroy(); } catch(e){} });
  chartInstances = {};

  const container = document.getElementById('reports-content');

      <div class="report-card"><h3>Daily Completions This Week</h3><div id="ch-weekly"></div></div>

function buildLeaderboardTable() {
  const sorted = state.children.slice().sort((a, b) => getChoreXP(b.id) - getChoreXP(a.id));
  const medals = ['🥇','🥈','🥉','4️⃣'];
  return `
  <div class="leaderboard-table">
    ${sorted.map((c, i) => `
    <div class="leaderboard-row" style="border-left:4px solid ${c.color}">
      <span class="medal">${medals[i] || (i+1)}</span>
      <span class="lb-avatar">${c.avatar}</span>
      <span class="lb-name">${c.name}</span>
      <span class="lb-level">Lvl ${getLevel(getChoreXP(c.id))}</span>
      <span class="lb-xp">⚡${getChoreXP(c.id)}</span>
      <span class="lb-streak">🔥${getStreak(c.id)}</span>
    </div>`).join('')}
  </div>`;
}

function buildParentAnalytics() {
  const allComp   = state.completions.length;
  const weekAgo   = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
  const weekComp  = state.completions.filter(c => new Date(c.date) >= weekAgo).length;

  // Most completed chore
  const counts = {};
  state.completions.forEach(c => { counts[c.choreId] = (counts[c.choreId] || 0) + 1; });
  const topId  = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0];
  const topCh  = topId ? getChoreById(topId) : null;

  // Most responsible
  const topChild = state.children.slice().sort((a,b) => getWeeklyCompletionPct(b.id) - getWeeklyCompletionPct(a.id))[0];
  const pending  = state.redemptions.filter(r => !r.approved).length;

  return `
  <div class="analytics-grid">
    <div class="analytics-card"><div class="analytics-value">${allComp}</div><div class="analytics-label">Total Quests</div></div>
    <div class="analytics-card"><div class="analytics-value">${weekComp}</div><div class="analytics-label">This Week</div></div>
    <div class="analytics-card"><div class="analytics-value">${getFamilyWeeklyPct()}%</div><div class="analytics-label">Family Rate</div></div>
    <div class="analytics-card"><div class="analytics-value">${topChild ? topChild.avatar : '—'}</div><div class="analytics-label">Top: ${topChild ? topChild.name : 'N/A'}</div></div>
  </div>
  <div class="report-card"><h3>Weekly Completion by Child</h3><div id="ch-rates"></div></div>
  ${topCh ? '<div class="analytics-highlight">⭐ Most completed quest: <strong>' + topCh.name + '</strong> (' + counts[topId] + 'x)</div>' : ''}
  <div class="analytics-highlight">⏳ <strong>${pending}</strong> reward redemption${pending !== 1 ? 's' : ''} awaiting approval</div>
  `;
}

function approveRedemption(id) {
  const r = state.redemptions.find(x => x.id === id);
  if (r) { r.approved = true; saveState(); showToast('Reward approved! 🎉', 'success'); showParentSection('approvals'); }
}

function denyRedemption(id) {
  if (!confirm('Deny this redemption?')) return;
  state.redemptions = state.redemptions.filter(x => x.id !== id);
  saveState();
  showToast('Redemption denied', 'info');
  showParentSection('approvals');
}

function addBonusPoints() {
  const childId = document.getElementById('bonus-child').value;
  const pts     = parseInt(document.getElementById('bonus-pts').value);
  const reason  = document.getElementById('bonus-reason').value || 'Bonus';
  if (!childId || isNaN(pts) || pts === 0) { showToast('Fill in all fields', 'error'); return; }
  if (!state.bonusPoints) state.bonusPoints = [];
  state.bonusPoints.push({ id: uid(), childId, points: pts, reason, date: getTodayStr() });
  saveState();
  const c = getChildById(childId);
  showToast((pts > 0 ? '⚡ +' : '➖ ') + Math.abs(pts) + ' pts for ' + c.name, 'success');
  document.getElementById('bonus-pts').value = '';
  document.getElementById('bonus-reason').value = '';
}

function updateChildName(id, v)  { const c = getChildById(id); if (c) { c.name = v; saveState(); } }
function updateChildAge(id, v)   { const c = getChildById(id); if (c) { c.age = parseInt(v)||c.age; saveState(); } }
function updateChildColor(id, v) { const c = getChildById(id); if (c) { c.color = v; saveState(); } }

function addChild() {
  const id = 'c' + uid();
  state.children.push({ id, name: 'New Child', age: 8, avatar: '🧒', color: CHILD_COLORS[Math.floor(Math.random() * CHILD_COLORS.length)] });
  state.earnedBadges[id] = [];
  saveState();
  showParentSection('children');
  showToast('Adventurer added!', 'success');
}

function removeChild(id) {
  const c = getChildById(id);
  if (!confirm('Remove ' + (c ? c.name : 'this child') + '? All their data will be deleted.')) return;
  state.children     = state.children.filter(x => x.id !== id);
  state.completions  = state.completions.filter(x => x.childId !== id);
  state.redemptions  = state.redemptions.filter(x => x.childId !== id);
  state.bonusPoints  = (state.bonusPoints || []).filter(x => x.childId !== id);
  delete state.earnedBadges[id];
  state.chores.forEach(ch => { ch.assignedTo = ch.assignedTo.filter(x => x !== id); });
  saveState();
  showParentSection('children');
}

function openAvatarPicker(childId) { showModal('avatar-picker', childId); }

async function saveSettings() {
  state.settings.familyName           = document.getElementById('s-family').value;
  state.settings.soundEnabled         = document.getElementById('s-sound').checked;
  state.settings.notificationsEnabled = document.getElementById('s-notif').checked;
  const newPwd = document.getElementById('s-pwd').value.trim();
  if (newPwd) {
    state.settings.passwordRecord = await makePasswordRecord(newPwd);
    delete state.settings.parentPassword;  // wipe any plain text
    state.settings.hasSetPassword = true;
  }
  saveState();
  showToast('Settings saved!', 'success');
}

// saveChallengeSettings replaced by saveFamilyChallenge

function previewRotation() {
  const preview = state.children.map(c => c.name);
  preview.push(preview.shift());
  const pairs = state.chores.slice(0, 3).map((ch, i) => ch.name + ' → ' + (preview[i % preview.length] || '?'));
  showToast('Preview: ' + pairs.join(', ') + '…', 'info');
}

function applyRotation() {
  if (!confirm('Rotate chore assignments now?')) return;
  state.chores.forEach(ch => {
    if (ch.assignedTo.length > 1) ch.assignedTo = [...ch.assignedTo.slice(1), ch.assignedTo[0]];
  });
  saveState();
  showToast('🔄 Rotation applied!', 'success');
}

function deleteReward(rewardId) {
  if (!confirm('Delete this reward?')) return;
  state.rewards = state.rewards.filter(r => r.id !== rewardId);
  saveState();
  showParentSection('quests');
  showToast('Reward deleted', 'info');
}
